<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"></head><body><title>Bodega Principal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,400..700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Tablero de control de bodega: barra superior con marca, pestañas deslizables,
   resumen primero y detalle después; tablas con desplazamiento propio en celular. */
:root {
  --bg: #f4f6f4;
  --surface: #ffffff;
  --ink: #16201b;
  --muted: #5b6961;
  --line: #d9e0dc;
  --line-strong: #b9c4be;
  --accent: #0a7f45;
  --accent-ink: #ffffff;
  --accent-soft: #e2f1e8;
  --ok: #1d7443;   --ok-soft: #e1f2e7;
  --warn: #9a5b00; --warn-soft: #fbefd9;
  --crit: #b0261d; --crit-soft: #fbe4e1;
  --bar: #0a7f45;
  --bar-2: #7fb99a;
  --shadow: 0 1px 2px rgba(20, 40, 30, .06);
  --f-ui: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --f-num: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1411; --surface: #151d19; --ink: #e5ece8; --muted: #9aa9a1; --line: #26312b; --line-strong: #3a4740;
    --accent: #3cbf7d; --accent-ink: #06170e; --accent-soft: #15301f;
    --ok: #62cc92; --ok-soft: #173424; --warn: #e3a84f; --warn-soft: #36290f; --crit: #f07d73; --crit-soft: #3a1917;
    --bar: #3cbf7d; --bar-2: #2f6b4b; --shadow: none; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1411; --surface: #151d19; --ink: #e5ece8; --muted: #9aa9a1; --line: #26312b; --line-strong: #3a4740;
  --accent: #3cbf7d; --accent-ink: #06170e; --accent-soft: #15301f;
  --ok: #62cc92; --ok-soft: #173424; --warn: #e3a84f; --warn-soft: #36290f; --crit: #f07d73; --crit-soft: #3a1917;
  --bar: #3cbf7d; --bar-2: #2f6b4b; --shadow: none; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-ui); font-size: 15px; line-height: 1.45; }
.num, td.n, .kpi b, .mono { font-family: var(--f-num); font-variant-numeric: tabular-nums; }
h1, h2, h3 { text-wrap: balance; margin: 0; font-stretch: 85%; }
h2 { font-size: 1.05rem; font-weight: 650; }
h3 { font-size: .95rem; font-weight: 600; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---- Barra superior ---- */
.top { background: var(--surface); border-bottom: 1px solid var(--line); }
.top-in { max-width: 1240px; margin: 0 auto; padding: 12px 16px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.top img { width: 44px; height: auto; flex: none; }
.marca { min-width: 0; flex: 1 1 220px; }
.marca h1 { font-size: 1.35rem; font-weight: 700; letter-spacing: -.01em; }
.marca p { margin: 0; color: var(--muted); font-size: .8rem; }
.corte { font-size: .78rem; color: var(--muted); text-align: right; }
.corte b { color: var(--ink); font-weight: 600; }
nav.tabs { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.tabs-in { max-width: 1240px; margin: 0 auto; padding: 0 8px; display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
.tabs-in::-webkit-scrollbar { display: none; }
.tab { flex: none; border: 0; background: none; padding: 12px 12px 10px; font-weight: 550; color: var(--muted); border-bottom: 3px solid transparent; cursor: pointer; font-stretch: 90%; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.tab:hover { color: var(--ink); }

main { max-width: 1240px; margin: 0 auto; padding-inline: 16px; padding-block: 16px 48px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
main > * { min-width: 0; }
.ctrl > * { max-width: 100%; }
.campo select { width: 100%; }
.encab { display: flex; justify-content: space-between; align-items: end; gap: 12px; flex-wrap: wrap; }
.encab p { margin: 2px 0 0; color: var(--muted); font-size: .85rem; max-width: 70ch; }

/* ---- Indicadores ---- */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; display: grid; gap: 2px; min-width: 0; text-align: left; }
button.kpi { cursor: pointer; }
button.kpi:hover { border-color: var(--line-strong); }
.kpi span { font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
.kpi b { font-size: 1.3rem; font-weight: 500; line-height: 1.2; overflow-wrap: anywhere; }
.kpi small { color: var(--muted); font-size: .78rem; }
.kpi.crit b { color: var(--crit); } .kpi.warn b { color: var(--warn); }

/* ---- Paneles ---- */
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 460px), 1fr)); gap: 16px; align-items: start; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: grid; gap: 12px; min-width: 0; box-shadow: var(--shadow); }
.panel-h { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.panel-h p { margin: 0; color: var(--muted); font-size: .8rem; }
.nota { color: var(--muted); font-size: .8rem; margin: 0; }
.vacio { color: var(--muted); padding: 18px 4px; text-align: center; }

/* ---- Controles ---- */
.ctrl { display: flex; gap: 8px; flex-wrap: wrap; align-items: end; }
.campo { display: grid; gap: 3px; min-width: 0; }
.campo > span { font-size: .7rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
input[type="search"], input[type="text"], input[type="number"], input[type="date"], select {
  background: var(--surface); border: 1px solid var(--line-strong); border-radius: 8px; padding: 8px 10px; min-height: 38px; max-width: 100%; }
input[type="number"] { width: 110px; }
.campo.ancho { flex: 1 1 220px; } .campo.ancho input { width: 100%; }
@media (max-width: 820px) { .tabla-inv .ocultar-cel { display: none; } .tabla-inv .solo-cel { display: block; } }
@media (max-width: 820px) { .tabla-inv td:first-child { min-width: 0; max-width: none; overflow-wrap: anywhere; } .tabla-inv td, .tabla-inv th { padding: 8px 6px; } .tabla-inv th .solo-cel { display: inline; } }
.busca { display: flex; gap: 6px; min-width: 0; } .busca input { flex: 1 1 auto; min-width: 0; } .busca .btn { flex: 0 0 auto; }
.chk { display: flex; gap: 6px; align-items: center; font-size: .88rem; min-height: 38px; }
.btn { border: 1px solid var(--line-strong); background: var(--surface); border-radius: 8px; padding: 8px 12px; min-height: 38px; cursor: pointer; font-weight: 550; white-space: nowrap; }
.btn:hover { border-color: var(--ink); }
.btn.pri { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.pri:hover { filter: brightness(1.08); }
.btn.peq { padding: 4px 9px; min-height: 30px; font-size: .82rem; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 8px 12px; min-height: 36px; cursor: pointer; font-weight: 550; color: var(--muted); }
.seg button + button { border-left: 1px solid var(--line-strong); }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--ink); }

/* ---- Tablas ---- */
.tabla { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: .86rem; }
th { text-align: left; font-size: .7rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 650; padding: 8px 10px; border-bottom: 1px solid var(--line-strong); background: var(--surface); white-space: nowrap; position: sticky; top: 0; }
td { padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
td.n, th.n { text-align: right; white-space: nowrap; }
tbody tr.clic { cursor: pointer; }
tbody tr.clic:hover td { background: var(--accent-soft); }
/* col-fija: la primera columna (Insumo) queda visible al desplazar la tabla */
.tabla th:first-child, .tabla td:first-child { position: sticky; left: 0; z-index: 1; background: var(--surface); }
.tabla th:first-child { z-index: 2; }
.tabla td:first-child { min-width: 150px; max-width: 46vw; box-shadow: 1px 0 0 var(--line); }
tbody tr.clic:hover td:first-child { background: var(--accent-soft); }
.tabla tr.grupo td { position: static; max-width: none; min-width: 0; box-shadow: none; background: var(--accent-soft); font-size: .8rem; padding: 6px 10px; }
tfoot td { font-weight: 650; border-top: 1px solid var(--line-strong); }
.sub { display: block; color: var(--muted); font-size: .76rem; }
.nombre { font-weight: 550; }
@media (max-width: 640px) { .ocultar-cel { display: none; } }
.solo-cel { display: none; }
/* Encabezado de proveedor en "Precios por proveedor": letra blanca sobre verde oscuro (se lee bien en tema claro y oscuro) */
#pre-comparar .tabla tr.grupo td { background: #0a7f45; color: #ffffff; letter-spacing: .02em; }
#pre-comparar .tabla tr.grupo td b { color: #ffffff; }
@media (max-width: 640px) { .solo-cel { display: block; } :is(#pre-comparar, #pre-cambios) .tabla td:first-child { min-width: 110px; max-width: none; overflow-wrap: anywhere; } :is(#pre-comparar, #pre-cambios) td, :is(#pre-comparar, #pre-cambios) th { padding: 8px 5px; } :is(#pre-comparar, #pre-cambios) td.n { font-size: .74rem; } #pre-cambios .seg button { padding: 8px 9px; font-size: .82rem; } #pre-cambios .seg { flex-wrap: wrap; max-width: 100%; } }

/* ---- Estados ---- */
.chip { display: inline-block; font-size: .72rem; font-weight: 650; padding: 2px 8px; border-radius: 99px; white-space: nowrap; letter-spacing: .02em; }
.chip.bajo { background: var(--crit-soft); color: var(--crit); }
.chip.normal { background: var(--ok-soft); color: var(--ok); }
.chip.sobre { background: var(--warn-soft); color: var(--warn); }
.chip.sin-consumo, .chip.gris { background: var(--bg); color: var(--muted); border: 1px solid var(--line); }
.chip.borrador { background: var(--bg); color: var(--muted); border: 1px solid var(--line); }
.chip.aprobado { background: var(--accent-soft); color: var(--accent); }
.chip.recibido { background: var(--ok-soft); color: var(--ok); }
.dias.critico { color: var(--crit); font-weight: 600; } .dias.alerta { color: var(--warn); font-weight: 600; }
.sube { color: var(--crit); } .baja { color: var(--ok); }

/* ---- Barras horizontales ---- */
.hbars { display: grid; gap: 8px; }
.hbar { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; font-size: .84rem; }
.hbar .pista { grid-column: 1 / -1; height: 8px; background: var(--bg); border-radius: 4px; overflow: hidden; }
.hbar .pista i { display: block; height: 100%; background: var(--bar); border-radius: 4px; }
svg.graf { width: 100%; height: auto; display: block; }
svg.graf text { fill: var(--muted); font-family: var(--f-num); font-size: 10px; }
svg.graf .eje { stroke: var(--line); stroke-width: 1; }
svg.graf .barra { fill: var(--bar); }
svg.graf .barra:hover { fill: var(--accent); opacity: .85; }
svg.graf .linea { fill: none; stroke: var(--accent); stroke-width: 2; }
svg.graf .punto { fill: var(--surface); stroke: var(--accent); stroke-width: 2; }
svg.graf .punto.ult { fill: var(--accent); }
svg.graf .area { fill: var(--accent-soft); }

/* ---- Lista de selección ---- */
.opciones { display: flex; flex-wrap: wrap; gap: 6px; max-height: 180px; overflow-y: auto; }
.opc { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 5px 10px; font-size: .8rem; cursor: pointer; text-align: left; }
.opciones.lista { flex-direction: column; flex-wrap: nowrap; gap: 0; max-height: 300px; border: 1px solid var(--line); border-radius: 8px; }
.opciones.lista .opc { border: 0; border-bottom: 1px solid var(--line); border-radius: 0; padding: 8px 10px; font-size: .86rem; width: 100%; }
.opciones.lista .opc:last-child { border-bottom: 0; }
.opciones.lista .opc[aria-pressed="true"] { font-weight: 650; }
.opc:hover, .opc[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }

/* ---- Detalle lateral ---- */
.velo { position: fixed; inset: 0; background: rgba(8, 16, 12, .45); z-index: 20; display: flex; justify-content: flex-end; }
.cajon { background: var(--bg); width: min(640px, 100%); height: 100%; overflow-y: auto; padding: calc(16px + env(safe-area-inset-top, 0px)) 16px calc(24px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 14px; align-content: start; border-left: 1px solid var(--line); }
.cajon-h { display: flex; justify-content: space-between; gap: 10px; align-items: start; }
.hechos { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; }
.hecho { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
.hecho span { display: block; font-size: .68rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
.hecho b { font-family: var(--f-num); font-weight: 500; font-size: .95rem; }
details.mov { border-bottom: 1px solid var(--line); }
details.mov summary { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; padding: 9px 4px; cursor: pointer; align-items: baseline; list-style: none; }
details.mov summary::-webkit-details-marker { display: none; }
details.mov summary:hover { background: var(--accent-soft); }
details.mov[open] summary { font-weight: 600; }
details.mov .cuerpo { padding: 0 4px 12px; }
.chat { gap: 10px; }
.mensajes { display: grid; gap: 10px; max-height: min(62vh, 640px); overflow-y: auto; padding: 4px 2px; }
.msg { display: flex; }
.msg.yo { justify-content: flex-end; }
.globo { max-width: min(680px, 92%); padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); overflow-wrap: anywhere; }
.msg.yo .globo { background: var(--accent-soft); border-color: transparent; white-space: pre-wrap; }
.globo p { margin: 0 0 6px; } .globo p:last-child { margin: 0; }
.globo ul { margin: 4px 0 6px; padding-left: 18px; display: grid; gap: 3px; }
.globo b { font-weight: 650; }
.mensajes { grid-template-columns: minmax(0, 1fr); }
.msg { min-width: 0; }
.globo { min-width: 0; }
.msg.ia .globo:has(.tabla) { width: 100%; }
.globo .tabla { margin: 6px 0 8px; background: var(--surface); max-width: 100%; overflow-x: auto; }
.globo .tabla table { font-size: .8rem; }
.globo .tabla th, .globo .tabla td { padding: 6px 8px; }
.globo .tabla td:first-child { min-width: 140px; }
.globo.pensando { color: var(--muted); font-style: italic; }
.acciones-globo { margin-top: 8px; }
.bienvenida { display: grid; gap: 8px; }
.preguntar { display: grid; gap: 8px; border-top: 1px solid var(--line); padding-top: 10px; }
textarea { font: inherit; color: inherit; background: var(--surface); border: 1px solid var(--line-strong); border-radius: 8px; padding: 8px 10px; width: 100%; resize: vertical; min-height: 60px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 8px; font-size: .88rem; z-index: 30; max-width: calc(100% - 32px); }
.resultado { font-family: var(--f-num); font-size: 1.6rem; }
.fila { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
footer { color: var(--muted); font-size: .76rem; max-width: 1240px; margin: 0 auto; padding: 0 16px 32px; }
@media (prefers-reduced-motion: no-preference) { .cajon { animation: entra .18s ease-out; } @keyframes entra { from { transform: translateX(24px); opacity: .6; } } }
</style>

<script>/* Copia web de consulta: los datos van cifrados (AES-GCM, clave derivada con PBKDF2) y solo se abren con la clave. */
(function () {
  const PAQP = fetch('datos.json?v=' + Date.now(), { cache: 'no-store' }).then(r => { if (!r.ok) throw new Error('sin datos'); return r.json(); });
  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  let abrir; const LISTO = new Promise(r => { abrir = r; });
  async function descifrar(clave) {
    const PAQ = await PAQP;
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(clave), 'PBKDF2', false, ['deriveKey']);
    const llave = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(PAQ.sal), iterations: PAQ.it, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    const plano = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(PAQ.iv) }, llave, b64(PAQ.dato));
    const txt = await new Response(new Blob([plano]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
    return JSON.parse(txt);
  }
  // Base de datos de solo lectura con lo que trae el paquete
  const soloLectura = () => Promise.reject(Object.assign(new Error('solo consulta'), { code: 'copia de solo consulta' }));
  window.claude = {
    use: async n => {
      const D = await LISTO;
      if (n === 'db') return {
        collection: c => ({
          get: async () => ({ docs: (c === 'actualizaciones' ? D.docs : []).map(d => ({ data: () => d })) }),
          onSnapshot: cb => { cb({ docs: [] }); return () => { }; },
          doc: () => ({ set: soloLectura, update: soloLectura })
        }),
        doc: () => ({ onSnapshot: cb => { cb({ exists: !!D.cfg, data: () => D.cfg }); return () => { }; }, set: soloLectura })
      };
      if (n === 'downloads') return {
        save: async o => { const a = document.createElement('a'); a.href = URL.createObjectURL(o.data); a.download = o.filename; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000); }
      };
      return null;
    }
  };
  const fetchOriginal = window.fetch.bind(window);
  window.fetch = (u, o) => (u === 'data.json' ? LISTO.then(D => new Response(JSON.stringify(D.raw), { headers: { 'Content-Type': 'application/json' } })) : fetchOriginal(u, o));
  // Pantalla de clave
  const f = document.getElementById('clave-form'), inp = document.getElementById('clave'), err = document.getElementById('clave-err'), btn = document.getElementById('clave-btn');
  async function entrar(clave, guardada) {
    btn.disabled = true; err.textContent = 'Abriendo…';
    try {
      const D = await descifrar(clave);
      if (document.getElementById('clave-rec').checked && !guardada) { try { localStorage.setItem('bodega-clave', clave); } catch (e) { } }
      document.getElementById('puerta').remove(); abrir(D);
    } catch (e) {
      if (guardada) { try { localStorage.removeItem('bodega-clave'); } catch (x) { } err.textContent = ''; }
      else err.textContent = (window.crypto && crypto.subtle && window.DecompressionStream) ? 'Clave incorrecta.' : 'Este navegador es muy antiguo para abrir la página. Use Chrome, Edge, Safari o Firefox actualizados.';
      btn.disabled = false; inp.focus();
    }
  }
  f.addEventListener('submit', ev => { ev.preventDefault(); if (inp.value.trim()) entrar(inp.value.trim(), false); });
  let g = null; try { g = localStorage.getItem('bodega-clave'); } catch (e) { }
  if (g) entrar(g, true); else inp.focus();
})();
</script>
<script>
/* ============================================================
   MODELO DE DATOS — Bodega Principal (datos de OSPOS)
   Funciones puras: se pueden probar fuera del navegador.
   ============================================================ */

const DEP_NOMBRES = {
  'formulacion principal': 'Formulación Principal',
  'empaque principal bodega principal': 'Empaque Principal',
  'empaque mani principal': 'Empaque Maní (verticales)',
  'empaque vertical principal': 'Empaque Maní (verticales)',
  'despachos': 'Despachos',
  'calidad bodega principal': 'Calidad',
  'averias': 'Averías',
  'azucar invertida': 'Azúcar invertida',
  'don andres': 'Don Andrés',
  'ajuste de final de mes': 'Ajuste de fin de mes',
  '': 'Sin departamento'
};
const DEP_PRODUCCION = ['Formulación Principal', 'Empaque Principal', 'Empaque Maní (verticales)'];

function sinTildes(s) {
  return String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '');
}
function normDep(d) {
  const k = sinTildes(d).toLowerCase().replace(/\s*--\s*$/, '').trim();
  if (k in DEP_NOMBRES) return DEP_NOMBRES[k];
  return String(d || '').replace(/\s*--\s*$/, '').trim() || 'Sin departamento';
}
/* ---------- Limpieza y organización de lo que llega de OSPOS ---------- */
const _UNI = { KG: ['KILO', 'KILOS'], KILO: ['KILO', 'KILOS'], KILOS: ['KILO', 'KILOS'], G: ['GRAMO', 'GRAMOS'], GR: ['GRAMO', 'GRAMOS'], LT: ['LITRO', 'LITROS'], L: ['LITRO', 'LITROS'],
  ML: ['MILILITRO', 'MILILITROS'], UND: ['UNIDAD', 'UNIDADES'], UNDS: ['UNIDAD', 'UNIDADES'], MTS: ['METRO', 'METROS'], M: ['METRO', 'METROS'] };
function presentacionDelNombre(nombre) {
  const m = sinTildes(nombre).toUpperCase().match(/\bX\s*(\d+(?:[.,]\d+)?)\s*(KILOS|KILO|KG|GR|G|LT|L|ML|UNDS|UND|MTS|M)\b/);
  if (!m || !_UNI[m[2]]) return '';
  const n = parseFloat(m[1].replace(',', '.'));
  return m[1].replace('.', ',') + ' ' + _UNI[m[2]][n === 1 ? 0 : 1];
}
function limpiaPresentacion(p, nombre) {
  p = String(p || '').trim().replace(/\s+/g, ' ').toUpperCase();
  // válida solo si empieza por un número y tiene una unidad reconocible ("1 0", "Q KILO" o "GRAMO" no lo son)
  if (!/^\d+(?:[.,]\d+)?\s+[A-ZÑ]{2,}/.test(p)) return presentacionDelNombre(nombre);
  return p.replace(/(\d)\.(\d)/, '$1,$2').replace(/UNIDADS\b/, 'UNIDADES').replace(/PANALS\b/, 'PANALES')
    .replace(/^1 (KILOS|GRAMOS|LITROS|UNIDADES|MILILITROS|LIBRAS|CAJAS)$/, (m0, u) => '1 ' + u.replace(/E?S$/, ''));
}
const GRUPOS = [   // el primero que coincida gana; el orden importa
  ['Empaque', 'Láminas de empaque', /\bLAMINAS?\b/],
  ['Empaque', 'Separadores', /\bSEPARADOR(ES)?\b/],
  ['Empaque', 'Cajas', /\bCAJAS?\b/],
  ['Empaque', 'Domos', /\bDOMOS?\b/],
  ['Empaque', 'Bolsas', /\bBOLSAS?\b/],
  ['Empaque', 'Capacillos', /\bCAPACILLOS?\b/],
  ['Empaque', 'Cintas, stickers y marcación', /\b(CINTAS?|VIDEO ?JET|STICKERS?|VINIPEL|PRECORTADO|ETIQUETAS?|RIBBON|PAPEL)\b/],
  ['Materia prima', 'Esencias y saborizantes', /\b(ESENCIAS?|SABOR|SABORIZANTE|VAINILLA)\b/],
  ['Materia prima', 'Colorantes', /\b(COLOR|COLORANTES?|TINTURA)\b/],

    const x = iz + ancho * i + (ancho - bw) / 2, yy = y(d.valor), h = Math.max(0, H - ab - yy);
    s += `<rect class="barra" x="${x.toFixed(1)}" y="${yy.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="2" fill="currentColor"${resaltarUltimo && i === datos.length - 1 ? ' style="fill:var(--accent)"' : ''}><title>${esc(d.titulo || d.etiqueta)}: ${esc(pesos(d.valor))}</title></rect>`;
    if (i % cada === 0) s += `<text x="${(iz + ancho * i + ancho / 2).toFixed(1)}" y="${H - 10}" text-anchor="middle">${esc(d.etiqueta)}</text>`;
  });
  return s + '</svg>';
}
function graficaLinea(puntos, { alto = 200, formato = v => pesos(v) } = {}) {
  if (puntos.length < 2) return '<p class="nota">Se necesitan al menos dos compras para ver la evolución del precio.</p>';
  const W = 640, H = alto, iz = 76, de = 12, ar = 12, ab = 26;
  const xs = puntos.map(p => d2n(p.fecha)), x0 = Math.min(...xs), x1 = Math.max(...xs) || x0 + 1;
  const vs = puntos.map(p => p.valor); let lo = Math.min(...vs), hi = Math.max(...vs);
  if (hi === lo) { lo = lo * .95; hi = hi * 1.05; } const pad = (hi - lo) * .15; lo = Math.max(0, lo - pad); hi += pad;
  const X = n => iz + (W - iz - de) * ((n - x0) / Math.max(1, x1 - x0)), Y = v => ar + (H - ar - ab) * (1 - (v - lo) / (hi - lo));
  let s = `<svg class="graf" viewBox="0 0 ${W} ${H}" role="img" aria-label="Evolución del precio">`;
  for (let i = 0; i <= 3; i++) { const v = lo + (hi - lo) * i / 3; s += `<line class="eje" x1="${iz}" x2="${W - de}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${iz - 6}" y="${Y(v) + 3}" text-anchor="end">${esc(formato(v))}</text>`; }
  const d = puntos.map((p, i) => (i ? 'L' : 'M') + X(xs[i]).toFixed(1) + ' ' + Y(p.valor).toFixed(1)).join(' ');
  s += `<path class="area" d="${d} L ${X(xs[xs.length - 1]).toFixed(1)} ${H - ab} L ${X(xs[0]).toFixed(1)} ${H - ab} Z"/><path class="linea" d="${d}"/>`;
  puntos.forEach((p, i) => { s += `<circle class="punto${i === puntos.length - 1 ? ' ult' : ''}" cx="${X(xs[i]).toFixed(1)}" cy="${Y(p.valor).toFixed(1)}" r="3.5"><title>${fecha(p.fecha)} · ${esc(p.proveedor)} · ${esc(pesos(p.valor))}</title></circle>`; });
  const meses = []; let m = n2d(x0).slice(0, 7); while (m <= n2d(x1).slice(0, 7)) { meses.push(m); const [a, b] = m.split('-').map(Number); m = b === 12 ? `${a + 1}-01` : `${a}-${String(b + 1).padStart(2, '0')}`; }
  meses.forEach(mm => { const n = d2n(mm + '-01'); if (n >= x0 && n <= x1) s += `<text x="${X(n).toFixed(1)}" y="${H - 8}" text-anchor="middle">${mesCorto(mm)}</text>`; });
  return s + '</svg>';
}
function barrasH(filas, total) {
  if (!filas.length) return '<p class="vacio">Sin datos.</p>';
  const max = Math.max(...filas.map(f => f.valor)) || 1;
  return '<div class="hbars">' + filas.map(f => `<div class="hbar"><span>${esc(f.nombre)}</span><span class="num">${pesos(f.valor)}${total ? ` · ${_fN0.format(f.valor / total * 100)} %` : ''}</span><div class="pista"><i style="width:${(f.valor / max * 100).toFixed(1)}%"></i></div></div>`).join('') + '</div>';
}

/* Buscar insumo en lenguaje natural: "cuánta grasa multipropósito tenemos" busca "grasa multiproposito".
   Quita palabras de relleno y plurales, entiende "50kg" = "50 kg" y tolera errores de una o dos letras ("margarna").
   Cada palabra se busca por niveles, del más exacto al más amplio:
   0) palabra completa en el nombre o el proveedor ("sal" no trae SALSA, "coco" no trae COCOA),
   1) inicio de palabra en el nombre o el proveedor, 2) nombre con 1–2 letras de diferencia ("aceite" → ACEITA),
   3) grupo, categoría o material ("grasa" → Grasas y aceites), 4) aproximada en todo.
   Se cruzan primero los niveles más exactos; si no queda nada, los amplios; si aún no, se descarta la palabra más débil. */
const VACIAS_INV = new Set(['tanta', 'tanto', 'tantas', 'tantos', 'queda', 'quedan', 'quedo', 'nos', 'bodega', 'bodegas', 'existencia', 'stock', 'inventario', 'numero', 'disponible', 'saldo',
  'cantidad', 'total', 'unidad', 'informacion', 'info', 'estado', 'busca', 'busco', 'encuentra', 'hallar', 'hoy', 'aqui', 'alla']);
const _nomU = it => sinTildes(it.nombre).toUpperCase();
const CAMBIOS_INV = { panificadora: 'panificacion', panaderia: 'panificacion', panificable: 'panificacion' };
const SINONIMOS_INV = {   // palabras que nombran un grupo entero, no una marca
  grasa: it => it.grupo === 'Grasas y aceites' || /^GRASAS?\b/.test(_nomU(it)),
  manteca: it => it.grupo === 'Grasas y aceites' || /^(GRASAS?|MANTECA)\b/.test(_nomU(it)),
  empaque: it => it.tipo === 'Empaque',
  trigo: it => /\bTRIGO\b/.test(_nomU(it) + ' ' + sinTildes(it.categoria).toUpperCase()) || (/^HARINA\b/.test(_nomU(it)) && !/\b(MAIZ|AVENA|ARROZ|ALMENDRAS?|COCO|YUCA|PLATANO)\b/.test(_nomU(it)))
};
function busquedaInventario(texto, filas) {
  // nombre exacto de OSPOS (copiado o dictado tal cual): solo ese insumo
  const exacto = norm(texto).replace(/\s+/g, ' ').trim();
  const iguales = filas.filter(f => norm(f.it.nombre).replace(/\s+/g, ' ').trim() === exacto);
  if (iguales.length && (/\d/.test(exacto) || exacto.split(' ').length >= 3)) return { filas: iguales, ws: [String(texto).trim()], ignoradas: [], aprox: [], calidad: 'estricto' };
  // los decimales son un solo número ("20.4 cm"); números unidos por "y", "o" o coma son alternativas
  // ("capacillos 4 y 5" = #4 o #5); los unidos por "x" son una medida y deben coincidir todos ("26 cm x 30 mic", "#5 x 1000")
  let t = normMedidas(norm(texto)).replace(/(\d)[.,](\d)/g, '$1d$2');
  const alternativas = [];
  t = t.replace(/#?\d+(?:d\d+)?(?:(?:\s*(?:,|;|\/|\by\b|\bo\b|\be\b)\s*|\s+)#?\d+(?:d\d+)?)+/g, (m, off, str) => {
    if (/\bx\s*$/.test(str.slice(0, off)) || /^\s*x\b/.test(str.slice(off + m.length))) return m;   // parte de una medida: no son alternativas
    alternativas.push(m.match(/#?\d+(?:d\d+)?/g).join('|')); return ' ';
  });
  let ws = palabrasPrecio(t).filter(w => !VACIAS_INV.has(w)).map(w => CAMBIOS_INV[w] || w).concat(alternativas);
  if (!ws.length) return { filas, ws: [], ignoradas: [], aprox: [] };
  const toks = t => normMedidas(norm(t)).replace(/(\d)[.,](\d)/g, '$1d$2').split(/[^a-z0-9#ñ]+/).filter(Boolean);
  const cache = new Map();
  const tx = f => { let x = cache.get(f.it.id); if (!x) { const it = f.it; x = { nom: toks(it.nombre), prov: toks(it.proveedor), resto: toks(it.categoria + ' ' + it.grupo + ' ' + (it.material || '') + ' ' + it.tipo) }; x.todo = normMedidas(norm(it.nombre + ' ' + it.proveedor + ' ' + it.categoria + ' ' + it.grupo + ' ' + (it.material || ''))); x.all = x.nom.concat(x.prov, x.resto); cache.set(f.it.id, x); } return x; };
  const ids = pred => new Set(filas.filter(pred).map(f => f.it.id));
  const sets = [], ignoradas = [], aprox = [];
  for (const w of ws) {
    let niveles;
    if (SINONIMOS_INV[w]) niveles = [ids(f => SINONIMOS_INV[w](f.it))];
    else if (/^#?\d+(d\d+)?(\|#?\d+(d\d+)?)*$/.test(w)) { const ns = w.split('|'); niveles = [ids(f => ns.some(x => { const n = x.replace(/^#/, ''); return tx(f).nom.some(t => t === '#' + n || (x[0] !== '#' && t === n)); }))]; }
    else {
      const igual = t => t === w || t === w + 's' || t === w + 'es', max = w.length >= 8 ? 2 : 1;
      niveles = [
        ids(f => tx(f).nom.some(igual) || tx(f).prov.some(igual)),
        ids(f => (w.length >= 3 && tx(f).nom.some(t => t.startsWith(w))) || (w.length >= 4 && tx(f).prov.some(t => t.startsWith(w)))),
        w.length >= 5 ? ids(f => tx(f).nom.some(t => t.length >= 4 && _lev(w, t, max) <= max)) : new Set(),
        w.length >= 4 ? ids(f => tx(f).resto.some(t => t.startsWith(w) || igual(t))) : new Set(),
        ids(f => palabraCoincide(w, tx(f).todo, tx(f).all))
      ];
    }
    const k = niveles.findIndex(x => x.size);
    if (k < 0) { ignoradas.push(w); continue; }
    if (k === 2 || k === 4) aprox.push(w);
    sets.push({ w, nivel: k, estricto: niveles[k], nombre: new Set(niveles.slice(0, 3).flatMap(x => [...x])), amplio: new Set(niveles.slice(0, 4).flatMap(x => [...x]).concat(k === 4 ? [...niveles[4]] : [])) });
  }
  const cruzar = c => filas.filter(f => sets.every(x => x[c].has(f.it.id)));
  let res = sets.length ? cruzar('estricto') : [], calidad = 'estricto';
  if (sets.length && !res.length) { res = cruzar('amplio'); calidad = 'amplio'; }
  while (sets.length > 1 && !res.length) {   // descarta la palabra más débil (la de nivel más amplio; si empatan, la última)
    let d = 0; sets.forEach((x, idx) => { if (x.nivel >= sets[d].nivel) d = idx; });
    ignoradas.push(sets.splice(d, 1)[0].w.replace(/\|/g, ' y ').replace(/(\d)d(\d)/g, '$1,$2')); calidad = 'descarte';
    res = cruzar('estricto'); if (!res.length) res = cruzar('amplio');
  }
  const usadas = sets.map(x => x.w.replace(/\|/g, ' y ').replace(/(\d)d(\d)/g, '$1,$2'));
  if (!usadas.length) res = [];
  // una sola palabra de producto: se prefieren los insumos que EMPIEZAN por ella ("sal" → SAL X 50 KG, no MANI CON SAL)
  if (sets.length === 1 && !SINONIMOS_INV[sets[0].w] && !/\d/.test(sets[0].w)) { const w = sets[0].w, cab = res.filter(f => { const t0 = tx(f).nom[0] || ''; return t0 === w || t0 === w + 's' || t0 === w + 'es'; }); if (cab.length) res = cab; }
  // "huevo" busca huevos, no el colorante "COLOR AMARILLO HUEVO" (salvo que se pida color o esencia)
  if (usadas.length && !usadas.some(w => _PALABRAS_SABOR.test(w))) { const sin = res.filter(f => !/^(COLOR|COLORANTE|ESENCIA|SABOR|SABORIZANTE)\b/.test(_nomU(f.it))); if (sin.length) res = sin; }
  return { filas: res, ws: usadas, ignoradas: ignoradas.map(w => w.replace(/\|/g, ' y ').replace(/(\d)d(\d)/g, '$1,$2')), aprox: aprox.filter(w => usadas.includes(w)), calidad: ignoradas.length ? 'descarte' : res.length && res.every(f => sets.every(x => x.nombre.has(f.it.id))) ? 'estricto' : 'flojo' };
}
/* Varias cosas a la vez ("bolsas 18 x 24 y 22 x 36", "harina y azúcar"): si la frase completa no se entiende entera,
   se busca cada parte por separado y se juntan; una parte que solo trae medidas hereda el producto de la anterior. */
/* Una parte de la búsqueda. Con "Solo con existencia": si lo encontrado no coincide por nombre en todas sus palabras
   (o no hay nada) y, en todo el catálogo, la frase sí coincide por nombre con insumos que están en cero, no se muestra otro
   producto en su lugar: 0 filas y aviso de que lo buscado no tiene existencia ("huevo en polvo" no trae el colorante). */

/* Varias cosas a la vez ("grasa multipropósito y industrial", "harina y azúcar", "bolsas 18x24 y 80x100"): cada parte se

function filtrarInventario() {
  const q = norm(E.inv.q).split(/\s+/).filter(Boolean);

    if (r.sinExistencia) r.sinExistencia = r.sinExistencia.slice().sort(cmpNom);
    filas = r.filas; E.inv.info = r; r.encontrados = filas.length;

  if (E.inv.prov !== 'todos') filas = filas.filter(f => f.it.proveedor === E.inv.prov);
  if (E.inv.grupo !== 'todos') filas = filas.filter(f => f.it.grupo === E.inv.grupo);

  return filas;
}
function notaBusquedaDur(filas) {
  const r = E.dur.info; if (!r) return '';
  if (!(r.ws.length || r.ignoradas.length)) return '<p class="nota">Escribe el nombre del producto (por ejemplo: azúcar, harina, caja 18 x 24) y toca Buscar.</p>';

}
function vistaDuracion() {
  const filas = filtrarDuracion();
  filas.sort((a, b) => E.dur.orden === 'duracion' ? (a.s.duracion - b.s.duracion) : cmpNom(a.it.nombre, b.it.nombre));

      </div>

/* ---------- Pedidos ---------- */
function precioReferencia(it) { const u = ultimoPrecioCompra(it); return u ? { precio: u.unitario, proveedor: u.proveedor, fuente: 'última compra ' + fecha(u.fecha) } : { precio: it.precio * (1 + it.iva / 100), proveedor: it.proveedor || 'Sin proveedor', fuente: 'precio de OSPOS + IVA' }; }
function sugerencias() {
  const grupos = new Map();
  for (const it of todosLosItems()) {
    const s = estadoDe(it); if (s.estado !== 'bajo' || !s.principal) continue;
    const sug = Math.max(0, Math.ceil(s.maximo - s.existencia)); if (!sug) continue;
    const ref = precioReferencia(it);
    const clave = ref.proveedor;
    const g = grupos.get(clave) || { proveedor: clave, lineas: [] };
    const editado = E.ped[it.id];
    g.lineas.push({ id: it.id, nombre: it.nombre, presentacion: it.presentacion, existencia: s.existencia, minimo: s.minimo, maximo: s.maximo, duracion: s.duracion, sugerido: sug, cant: editado ?? sug, precio: ref.precio, fuente: ref.fuente });
    grupos.set(clave, g);
  }
  return [...grupos.values()].map(g => ({ ...g, lineas: g.lineas.sort((a, b) => cmpNom(a.nombre, b.nombre)), total: g.lineas.reduce((a, l) => a + l.cant * l.precio, 0) })).sort((a, b) => cmpNom(a.proveedor, b.proveedor));
}
function vistaPedidos() {
  const gs = sugerencias(), totalSug = gs.reduce((a, g) => a + g.total, 0);
  const guardados = PEDIDOS.slice().sort((a, b) => (b.num || 0) - (a.num || 0));
  return `
  <div class="encab"><div><h2>Pedidos sugeridos</h2><p>Insumos en o bajo su mínimo. Cantidad sugerida = máximo − existencia, redondeada hacia arriba en la unidad de OSPOS. El precio de referencia es el de la última compra.</p></div></div>
  <div class="kpis"><div class="kpi"><span>Proveedores</span><b>${gs.length}</b></div><div class="kpi"><span>Insumos por pedir</span><b>${gs.reduce((a, g) => a + g.lineas.length, 0)}</b></div><div class="kpi"><span>Valor estimado</span><b>${pesos(totalSug)}</b><small>con precios de la última compra</small></div></div>
  ${!DB ? '<p class="nota">Guardar pedidos requiere la base de datos de la página, que no está disponible en esta vista. Puedes exportarlos a Excel.</p>' : ''}
  ${gs.map((g, gi) => `
  <section class="panel">
    <div class="panel-h"><h2>${esc(g.proveedor)}</h2><p>${g.lineas.length} insumos · <b class="num">${pesos(g.total)}</b></p></div>
    <div class="tabla"><table><thead><tr><th>Insumo</th><th class="n">Existencia</th><th class="n ocultar-cel">Mín. / Máx.</th><th class="n">Pedir</th><th class="n ocultar-cel">Precio ref.</th><th class="n">Valor</th></tr></thead><tbody>
    ${g.lineas.map(l => `<tr><td><span class="nombre">${esc(l.nombre)}</span><span class="sub">${l.presentacion ? esc(l.presentacion.toLowerCase()) + ' · ' : ''}dura ${txtDias(l.duracion)} días</span></td><td class="n">${cant(l.existencia)}</td><td class="n ocultar-cel">${_fN0.format(Math.ceil(l.minimo))} / ${_fN0.format(Math.ceil(l.maximo))}</td><td class="n"><input type="number" min="0" step="any" id="ped-${l.id}" data-ped="${l.id}" value="${l.cant}" style="width:96px" aria-label="Cantidad a pedir de ${esc(l.nombre)}"></td><td class="n ocultar-cel">${pesos(l.precio)}<span class="sub">${esc(l.fuente)}</span></td><td class="n">${pesos(l.cant * l.precio)}</td></tr>`).join('')}
    </tbody></table></div>
    <div class="fila"><button class="btn pri" data-accion="ped-guardar" data-g="${gi}" ${DB ? '' : 'disabled'}>Guardar como borrador</button><button class="btn" data-accion="ped-xls" data-g="${gi}">Excel del pedido</button></div>
  </section>`).join('') || '<section class="panel"><p class="vacio">Ningún insumo está bajo su mínimo. No hay pedidos por sugerir.</p></section>'}
  <section class="panel">
    <div class="panel-h"><h2>Pedidos guardados</h2><p>Borrador → Aprobado (Mateo Taborda) → Recibido</p></div>
    ${guardados.length ? `<div class="tabla"><table><thead><tr><th>Pedido</th><th>Proveedor</th><th class="n ocultar-cel">Insumos</th><th class="n">Valor</th><th>Estado</th><th></th></tr></thead><tbody>
    ${guardados.map(p => `<tr><td class="mono">PED-${String(p.num).padStart(4, '0')}<span class="sub">${fecha(p.fecha)}</span></td><td>${esc(p.proveedor)}</td><td class="n ocultar-cel">${p.lineas.length}</td><td class="n">${pesos(p.total)}</td>
      <td><select data-pedido-estado="${esc(p._id)}" aria-label="Estado del pedido">${['Borrador', 'Aprobado', 'Recibido'].map(s => `<option ${p.estado === s ? 'selected' : ''}>${s}</option>`).join('')}</select></td>
      <td><button class="btn peq" data-accion="ped-xls-guardado" data-id="${esc(p._id)}">Excel</button></td></tr>`).join('')}
    </tbody></table></div>` : `<p class="vacio">${DB ? 'Aún no has guardado pedidos. Usa “Guardar como borrador” en una sugerencia.' : 'Sin pedidos guardados.'}</p>`}
  </section>`;
}

/* ---------- Movimientos ---------- */
function vistaMovimientos() {
  if (!E.mov.desde) { E.mov.desde = sumaDias(MODELO.fechaCorte, -29); E.mov.hasta = MODELO.fechaCorte; }
  const q = norm(E.mov.q).split(/\s+/).filter(Boolean);
  const nombreIt = id => (MODELO.items.get(id) || {}).nombre || String(id);
  let lista;
  if (E.mov.tipo === 'salidas') {
    lista = MODELO.salidas.filter(s => s.fecha >= E.mov.desde && s.fecha <= E.mov.hasta && (E.mov.dep === 'todos' || s.dep === E.mov.dep));
    if (q.length) lista = lista.filter(s => { const t = norm('pos ' + s.pos + ' ' + s.dep + ' ' + s.comentario + ' ' + s.lineas.map(l => nombreIt(l.id)).join(' ')); return q.every(w => t.includes(w)); });
  } else {
    lista = MODELO.entradas.filter(e => e.fecha >= E.mov.desde && e.fecha <= E.mov.hasta);
    if (q.length) lista = lista.filter(e => { const t = norm(e.id + ' ' + e.proveedor + ' ' + e.referencia + ' ' + e.comentario + ' ' + e.lineas.map(l => nombreIt(l.id)).join(' ')); return q.every(w => t.includes(w)); });
  }
  lista = lista.slice().reverse();
  const total = E.mov.tipo === 'salidas' ? lista.reduce((a, s) => a + s.total, 0) : lista.reduce((a, e) => a + e.total, 0);
  const vis = lista.slice(0, E.mov.limite);
  return `
  <div class="encab"><div><h2>Movimientos</h2><p>Salidas a producción (recibos POS) y entradas de proveedores registradas en OSPOS. Toca una fila para ver sus insumos.</p></div>
  <button class="btn" data-accion="xls-mov">Exportar a Excel</button></div>
  <div class="ctrl">
    <div class="campo"><span>Tipo</span><div class="seg"><button data-accion="mov-tipo" data-v="salidas" aria-pressed="${E.mov.tipo === 'salidas'}">Salidas</button><button data-accion="mov-tipo" data-v="entradas" aria-pressed="${E.mov.tipo === 'entradas'}">Entradas</button></div></div>
    ${campoBuscar('mov-q', 'Buscar', E.mov.q, E.mov.tipo === 'salidas' ? 'N.º POS o insumo' : 'Proveedor, remisión o insumo')}
    <label class="campo"><span>Desde</span><input type="date" id="mov-desde" value="${E.mov.desde}"></label>
    <label class="campo"><span>Hasta</span><input type="date" id="mov-hasta" value="${E.mov.hasta}"></label>
    ${E.mov.tipo === 'salidas' ? `<label class="campo"><span>Departamento</span><select id="mov-dep">${opcionesDep(E.mov.dep)}</select></label>` : ''}
  </div>
  <p class="nota"><b>${lista.length}</b> ${E.mov.tipo} · total <b class="num">${pesos(total)}</b>${E.mov.tipo === 'salidas' ? ' con IVA' : ''}</p>
  <section class="panel" style="gap:0;padding:4px 10px">
  ${vis.length ? vis.map(m => E.mov.tipo === 'salidas' ? `
    <details class="mov"><summary><span class="mono">POS ${m.pos}</span><span>${esc(m.dep)}<span class="sub">${fecha(m.fecha)} ${m.hora} · ${esc(m.emp)} · ${m.lineas.length} insumos</span></span><span class="num">${pesos(m.total)}</span></summary>
    <div class="cuerpo"><div class="tabla"><table><thead><tr><th>Insumo</th><th class="n">Cantidad</th><th class="n">Subtotal</th><th class="n ocultar-cel">IVA</th><th class="n">Total</th></tr></thead><tbody>
    ${m.lineas.map(l => `<tr class="clic" data-item="${l.id}"><td>${esc(nombreIt(l.id))}</td><td class="n">${cant(l.cant)}</td><td class="n">${pesos(l.sub)}</td><td class="n ocultar-cel">${pesos(l.iva)}</td><td class="n">${pesos(l.sub + l.iva)}</td></tr>`).join('')}
    </tbody><tfoot><tr><td>Total</td><td></td><td class="n">${pesos(m.sub)}</td><td class="n ocultar-cel">${pesos(m.iva)}</td><td class="n">${pesos(m.total)}</td></tr></tfoot></table></div>
    <div class="fila" style="margin-top:8px"><button class="btn peq" data-accion="xls-salida" data-id="${m.pos}">Excel de esta salida</button></div></div></details>` : `
    <details class="mov"><summary><span class="mono">N.º ${m.id}</span><span>${esc(m.proveedor)}<span class="sub">${fecha(m.fecha)} · ${esc(m.referencia || 'sin referencia')} · ${esc(m.pago)}${m.comentario ? ' · ' + esc(m.comentario) : ''}</span></span><span class="num">${pesos(m.total)}</span></summary>
    <div class="cuerpo"><div class="tabla"><table><thead><tr><th>Insumo</th><th class="n">Cantidad</th><th class="n">Precio unidad</th><th class="n">Valor</th></tr></thead><tbody>
    ${m.lineas.map(l => `<tr class="clic" data-item="${l.id}"><td>${esc(nombreIt(l.id))}</td><td class="n">${cant(l.cant)}</td><td class="n">${l.cant ? pesos(l.total / l.cant) : '—'}</td><td class="n">${pesos(l.total)}</td></tr>`).join('')}
    </tbody></table></div></div></details>`).join('') : '<p class="vacio">No hay movimientos con estos filtros.</p>'}
  </section>
  ${lista.length > vis.length ? `<div class="fila"><button class="btn" data-accion="mov-mas">Ver ${Math.min(80, lista.length - vis.length)} más</button><span class="nota">Mostrando ${vis.length} de ${lista.length}</span></div>` : ''}`;
}

/* ---------- Detalle de un insumo ---------- */

      <p class="nota">Es la misma materia prima con otra marca o proveedor. El consumo por día, la duración, el mínimo y el máximo de arriba suman todos estos insumos${s.equivalentes.some(e => e.factor !== 1) ? ', convertidos a la presentación de este' : ''}.</p>

async function guardarCfg() {
  if (!DB) { toast('Guardado solo en esta sesión: la base de datos no está disponible aquí.'); render(); return; }
  try { await DB.doc('config/parametros').set(JSON.parse(JSON.stringify(CFG))); toast('Parámetros guardados'); }
  catch (e) { toast('No se pudieron guardar los parámetros (' + (e.code || 'error') + ').'); }
  render();
}
async function guardarPedido(g) {
  if (!DB) return;
  const num = PEDIDOS.reduce((m, p) => Math.max(m, p.num || 0), 0) + 1;
  const lineas = g.lineas.filter(l => l.cant > 0).map(l => ({ id: l.id, nombre: l.nombre, presentacion: l.presentacion || '', cant: +l.cant, precio: Math.round(l.precio * 100) / 100 }));
  if (!lineas.length) { toast('El pedido no tiene cantidades.'); return; }
  const doc = { num, fecha: MODELO.fechaCorte, proveedor: g.proveedor, estado: 'Borrador', lineas, total: Math.round(lineas.reduce((a, l) => a + l.cant * l.precio, 0)), creado: new Date().toISOString() };
  try { await DB.collection('pedidos').doc('PED-' + String(num).padStart(4, '0')).set(doc); toast(`Pedido PED-${String(num).padStart(4, '0')} guardado como borrador`); }
  catch (e) { toast('No se pudo guardar el pedido (' + (e.code || 'error') + ').'); }
}
async function cambiarEstadoPedido(id, estado) {
  if (!DB) return;
  try { await DB.collection('pedidos').doc(id).update({ estado }); toast('Pedido ' + id + ': ' + estado); }
  catch (e) { toast('No se pudo cambiar el estado (' + (e.code || 'error') + ').'); }
}

function irA(tab) {
  if (tab !== 'asistente' && typeof VOZ_OK !== 'undefined' && VOZ_OK && E.chat && E.chat.leyendo !== null) { window.speechSynthesis.cancel(); E.chat.leyendo = null; }
  E.tab = tab; cerrarItem();
  document.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === tab ? 'true' : 'false'));
  try { history.replaceState(null, '', '#' + tab); } catch (e) { }
  render(); window.scrollTo(0, 0);
}

}

/* Precio por unidad de un insumo: el de la presentación de OSPOS (bulto, caja, paquete…) sin y con IVA, y,

/* Todo lo que ha llegado (entradas de proveedores) de un insumo en un período: cantidad, valor y precio promedio. */
function llegadasDe(it, desde, hasta) {

}

1. Toda cifra que des debe salir de una herramienta. Nunca inventes, supongas ni estimes cifras que las herramientas no devolvieron. Si no hay dato, dilo claramente.
2. Si el insumo es ambiguo (varias marcas o proveedores), usa buscar_insumos y di cuál tomaste; si hay varios relevantes, compáralos.
3. Valores en pesos colombianos. Inventario y gastos van SIN IVA salvo que la herramienta diga otra cosa. El precio de compra por unidad es el valor de la entrada dividido por la cantidad (valor con IVA, como quedó en OSPOS).

function mdLite(t) {
  const out = []; let lista = [], tabla = [];
  const inl = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
  const cerrar = () => { if (lista.length) { out.push('<ul>' + lista.map(x => '<li>' + x + '</li>').join('') + '</ul>'); lista = []; } };
  const celdas = l => l.replace(/^\|/, '').replace(/\|$/, '').split('|').map(c => c.trim());
  const esNum = c => /^[-−]?\s*\$?\s*[\d.,]+(\s*(%|días?|kg|bultos?))?$/i.test(c.replace(/\*\*/g, '')) || c === '—';
  const cerrarTabla = () => {
    if (!tabla.length) return;
    const filas = tabla.filter(r => !r.every(c => /^:?-{2,}:?$/.test(c)));
    const [cab, ...cuerpo] = filas;
    out.push('<div class="tabla"><table><thead><tr>' + cab.map(c => '<th>' + inl(c) + '</th>').join('') + '</tr></thead><tbody>' +
      cuerpo.map(r => '<tr>' + r.map((c, k) => '<td' + (k > 0 && esNum(c) ? ' class="n"' : '') + '>' + inl(c) + '</td>').join('') + '</tr>').join('') + '</tbody></table></div>');
    tabla = [];
  };
  for (const raw of String(t).split('\n')) {
    const l = raw.trim();
    if (/^\|.*\|$/.test(l)) { cerrar(); tabla.push(celdas(l)); continue; }
    cerrarTabla();
    if (!l) { cerrar(); continue; }
    const m = l.match(/^([-•*]|\d+[.)])\s+(.*)$/);
    if (m) { lista.push(inl(m[2])); continue; }
    cerrar();
    const h = l.match(/^#{1,4}\s+(.*)$/);
    out.push(h ? '<p><b>' + inl(h[1]) + '</b></p>' : '<p>' + inl(l) + '</p>');
  }
  cerrar(); cerrarTabla(); return out.join('');
}

  } catch (e) {
    const code = e && e.code;
    if (e && e.text) c.turnos.push({ role: 'assistant', content: e.text + (code === 'cancelled' ? '\n\n(Detenida.)' : '') });
    else if (code !== 'cancelled') c.turnos.pop();
    const msg = { not_granted: 'No se dio permiso para usar Claude en esta página. Recarga la página para que vuelva a preguntar.', sampling_disabled: 'Claude no está disponible para esta cuenta.',
      rate_limited: 'Se alcanzó el límite de uso por ahora. Intenta de nuevo en unos minutos.', session_expired: 'Tu sesión de Claude expiró. Inicia sesión de nuevo.',
      prompt_too_large: 'La conversación es muy larga. Empieza una nueva conversación.', refused: 'Claude no respondió esa pregunta. Reformúlala.',
      tools_unavailable: 'Esta vista no permite que el asistente consulte los datos.', empty_completion: 'No hubo respuesta. Reformula la pregunta.' }[code];
    if (code === 'not_granted' || code === 'sampling_disabled' || code === 'tools_unavailable') { if (code !== 'not_granted') SAMPLE = null; }
    if (code !== 'cancelled') c.error = msg || 'No se pudo completar la respuesta por un problema de conexión. Intenta de nuevo.';
  } finally {
    c.ocupado = false; c.estado = ''; _ctlIA = null;
    if (E.tab === 'asistente') { render(); iaScroll(); }
    const ult = c.turnos.length - 1;
    if (c.voz && VOZ_OK && c.turnos[ult] && c.turnos[ult].role === 'assistant') hablar(ult);
  }
}
async function conectarIA() {
  try { SAMPLE = await window.claude.use('sample'); } catch (e) { SAMPLE = null; }
  if (SAMPLE) { try { const l = await SAMPLE.limits(); SAMPLE_TOOLS = !!(l && l.tools); } catch (e) { SAMPLE_TOOLS = false; } }
  SAMPLE_LISTO = true; if (E.tab === 'asistente') render();
}

/* ============================================================
   ARRANQUE
   ============================================================ */
function reconstruir() {
  MODELO = construirModelo(RAW, ACTUALIZACIONES);
  const ultAct = ACTUALIZACIONES.map(u => u.at || '').sort().pop();
  document.getElementById('corte').innerHTML = `Datos de OSPOS al <b>${fecha(MODELO.fechaCorte)}</b><br>${_fN0.format(MODELO.salidas.length)} salidas · ${_fN0.format(MODELO.entradas.length)} entradas${ultAct ? ' · actualizado ' + fecha(ultAct.slice(0, 10)) : ''}`;
  document.getElementById('pie').textContent = `Fuente: OSPOS Bodega Principal (santabodega.sisco.digital), solo lectura. Historial desde ${fecha(MODELO.primeraFecha)}. Valores de inventario y gasto sin IVA salvo donde se indica; compras con el valor registrado en la entrada.`;
  render();
}
async function conectarCapacidades() {
  if (!window.claude || typeof window.claude.use !== 'function') { SAMPLE_LISTO = true; render(); return; }
  conectarIA();
  try { DL = await window.claude.use('downloads'); } catch (e) { DL = null; }
  try { DB = await window.claude.use('db'); } catch (e) { DB = null; }
  if (!DB) { render(); return; }
  try {
    const snap = await DB.collection('actualizaciones').get();
    ACTUALIZACIONES = snap.docs.map(d => d.data()).filter(Boolean);
    if (ACTUALIZACIONES.length) reconstruir();
  } catch (e) { }
  DB.doc('config/parametros').onSnapshot(s => { if (s.exists) { const d = s.data(); CFG = { defaults: Object.assign({ rep: 7, seg: 3, cob: 15 }, d.defaults || {}), items: Object.assign({}, d.items || {}) }; render(); } }, () => { });
  DB.collection('pedidos').onSnapshot(q => { PEDIDOS = q.docs.map(d => Object.assign({ _id: d.id }, d.data())); if (E.tab === 'pedidos') render(); }, () => { });
  render();
}
(async function iniciar() {
  const h = (location.hash || '').replace('#', '');
  if (['inicio', 'asistente', 'inventario', 'gastos', 'precios', 'duracion', 'pedidos', 'movimientos'].includes(h)) { E.tab = h; document.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === h ? 'true' : 'false')); }
  try {
    RAW = await fetch('data.json').then(r => { if (!r.ok) throw new Error(r.status); return r.json(); });
  } catch (e) {
    document.getElementById('vista').innerHTML = '<p class="vacio">No se pudieron cargar los datos del inventario. Recarga la página.</p>'; return;
  }
  reconstruir();
  conectarCapacidades();
})();
